# ---------------------------------------------------------------
# PUBLICATIONS  (newest first)
#
# To add a paper, copy one block below and edit it. Fields:
#   id            short unique name, no spaces
#   title         paper title
#   year          publication year
#   biorxiv_doi   DOI of the bioRxiv preprint (makes the "bioRxiv" button)
#   doi           DOI of the PUBLISHED paper (makes the "Paper" button)
#   venue         journal name -- only needed once published
#   tags          any of: crispr-screens, notch-signaling, metabolism, cell-labeling
#   featured      true = also shown in the "Selected Work" cards near the top
#   image         (optional) file name of a figure you put in the /images folder
#   equal_contribution   true = adds a "* Equal contribution" note
#   authors       paste the author list straight from the paper, as one line.
#                 "Mohammed Mutaher" is bolded automatically.
#
# WHEN A PREPRINT GETS PUBLISHED: keep the biorxiv_doi line, then add
#   doi:   (the journal DOI)   and   venue:   (the journal name)
# and both buttons appear. Until then it is labeled "bioRxiv (preprint)".
# ---------------------------------------------------------------

