# ---------------------------------------------------------------
# POSTERS AND PRESENTATIONS  (newest first)
#
# One block per poster/talk TITLE. Every meeting where you presented it
# goes in that block's "presentations" list (they become teal bullets).
# To add a new title, copy a whole block. To add another meeting for an
# existing title, copy one "- event:" group.
#
#   title      poster / talk title
#   authors    (optional) paste the author list; "Mohammed Mutaher" is bolded.
#              Leave as "" to hide the line.
#   event      meeting name
#   location   city, state
#   date       as you want it displayed
#   url        (optional) link on the meeting name to the event website
#   poster     (optional) path to a picture or PDF of the poster, e.g.
#              /images/posters/broad-retreat-2024.png
#              Upload the file to images/posters on GitHub first.
#              The little poster icon only appears once this is filled in.
# ---------------------------------------------------------------

